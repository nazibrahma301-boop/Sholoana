 const m=P.map((p,i)=>({p,i,n:sel.filter(t=>p.kw.split(' ').includes(t)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n||a.i-b.i);ct.textContent=m.length?`${m.length} match${m.length>1?'es':''}`:'';
 box.innerHTML=m.length?m.map((x,j)=>row(x.p.id,'৳'+x.p[8],String(j+1).padStart(2,'0'))).join(''):'<div class="emp2"><b>No exact match</b><p>Try fewer filters, or ask us and we will help you choose.</p><a class="btn" href="#contact" data-go="contact">Ask us</a></div>';
 $$('#fres .row').forEach((r,j)=>{r.classList.remove('rv');r.style.opacity=1;if(!fPrev.has(r.dataset.go)&&!reduce)r.animate([{opacity:0,transform:'translate3d(0,18px,0)'},{opacity:1,transform:'none'}],{duration:700,delay:j*60,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'})});fPrev=new Set(m.map(x=>x.p.id))}
function renderG(){const s=$('#slots');if(!s)return;const prevN=s.dataset.f?s.dataset.f.split(',').length:0;
 s.innerHTML=Array.from({length:gn},(_,k)=>gp[k]!==undefined?`<button class="slot full" data-k="${k}" aria-label="Remove ${P[gp[k]][1]}"><small>0${k+1}</small><b>${P[gp[k]][1]}</b><span>${P[gp[k]][2]}</span></button>`:`<div class="slot"><small>0${k+1}</small><span>Empty</span></div>`).join('');s.dataset.f=gp.join();
 $$('#gch .chip').forEach(c=>{const on=gp.includes(+c.dataset.i);c.setAttribute('aria-pressed',on);c.setAttribute('aria-disabled',!on&&gp.length>=gn)});
 $('#gt').textContent='৳'+gp.reduce((a,i)=>a+P[i][8],0);const b=$('#gadd');b.disabled=gp.length<gn;$('.bl',b).textContent=gp.length<gn?`Choose ${gn-gp.length} more`:'Add box to bag';place($('#seg'));
 if(!reduce&&gp.length>prevN){const f=$$('.slot.full',s)[gp.length-1];f&&f.animate([{transform:'scale(.82)',opacity:0},{transform:'scale(1.04)',offset:.6},{transform:'none',opacity:1}],{duration:560,easing:'cubic-bezier(.2,.9,.3,1)'})}}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest('#sbtn'))return openS();
 if(t.closest('#srch')&&!t.closest('.spanel'))return closeS();
 const sf=t.closest('#sf .chip');if(sf){$$('#sf .chip').forEach(c=>c.classList.toggle('act',c===sf));sFilter=sf.dataset.f;runS();$('#sin').focus();return}
 const sg=t.closest('.sug');if(sg){$('#sin').value=sg.dataset.q;runS();$('#sin').focus();return}
 const qa=t.closest('.qa');if(qa){add(+qa.dataset.i,qa,1);return}
 const rs=t.closest('.res');if(rs){closeS();go(rs.dataset.id);return}
 const fc=t.closest('#fchips .chip');if(fc){const k=fc.dataset.t;fSel.has(k)?fSel.delete(k):fSel.add(k);fRender();return}
 const sb=t.closest('#seg button');if(sb){$$('#seg button').forEach(b=>b.classList.toggle('act',b===sb));gn=+sb.dataset.n;gp=gp.slice(0,gn);renderG();return}
 const gc=t.closest('#gch .chip');if(gc){const i=+gc.dataset.i,k=gp.indexOf(i);if(k>-1)gp.splice(k,1);else if(gp.length<gn)gp.push(i);else{$('#slots').animate(shake,{duration:380});buzz([8,20,8]);toast(`Your box holds ${gn} items. Tap one to swap.`);return}renderG();return}
 const sl=t.closest('.slot.full');if(sl){gp.splice(+sl.dataset.k,1);renderG();return}
 if(t.closest('#gadd')&&gp.length===gn){const sum=gp.reduce((a,i)=>a+P[i][8],0),it=gp.slice();it.forEach(i=>add(i,null,1,1));fly($('#gadd'));buzz(14);toast(`Gift box added · ৳${sum}`,()=>it.forEach(i=>add(i,null,-1,1)));gp=[];renderG();setTimeout(()=>{const b=$('#bag');b.classList.remove('bump');b.offsetWidth;b.classList.add('bump')},780);return}
 if(t.closest('#again'))$('#form').classList.remove('ok');
});
/* contact form: validation, loading, success, error */
document.addEventListener('input',e=>{const el=e.target;if(el.closest&&el.closest('#form')&&el.getAttribute('aria-invalid')==='true'){el.setAttribute('aria-invalid','false');el.nextElementSibling.textContent=''}});
$('#form').addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim(),er={};
 if(v('n').length<2)er.n='Please tell us your name';
 if(!/^(\+?88)?01[3-9]\d{8}$/.test(v('p').replace(/[\s-]/g,'')))er.p='Enter a Bangladeshi mobile number, like 01712345678';
 if(v('m').length<4)er.m='Write a short message';
 ['n','p','m'].forEach(k=>{const el=f.elements[k];el.nextElementSibling.textContent=er[k]||'';el.setAttribute('aria-invalid',!!er[k])});
 const bad=Object.keys(er)[0];if(bad){f.elements[bad].focus();f.animate(shake,{duration:420});buzz([10,30,10]);return}
 const b=$('button[type=submit]',f);b.classList.add('ld');b.disabled=true;
 const w=open(`https://wa.me/${WA}?text=${encodeURIComponent(`Name: ${v('n')}\nPhone: ${v('p')}\n${v('m')}`)}`,'_blank');
 setTimeout(()=>{b.classList.remove('ld');b.disabled=false;if(w){f.classList.add('ok');f.reset()}else toast('Pop-up blocked. Please allow pop-ups, or message us on WhatsApp directly.')},650)});
/* carousel: mouse drag, momentum, spring snap (touch uses native snap) */
(()=>{const c=$('#car');if(!c)return;const bar=$('.cprog i');let dn=false,lx=0,v=0,mv=0,raf;
 const upd=window.carUpd=()=>{const mid=c.scrollLeft+c.clientWidth/2;$$('.cc',c).forEach(k=>{const d=Math.abs(k.offsetLeft+k.offsetWidth/2-mid)/(c.clientWidth||1);k.style.setProperty('--s',(1-Math.min(d,.6)*.1).toFixed(3));k.style.opacity=(1-Math.min(d,.7)*.5).toFixed(2)});const m=c.scrollWidth-c.clientWidth;bar.style.transform=`scaleX(${m>0?Math.max(.08,c.scrollLeft/m):1})`};
 const snap=()=>{const mid=c.scrollLeft+c.clientWidth/2;let b=null,bd=1e9;$$('.cc',c).forEach(k=>{const d=Math.abs(k.offsetLeft+k.offsetWidth/2-mid);if(d<bd){bd=d;b=k}});const to=b.offsetLeft+b.offsetWidth/2-c.clientWidth/2,from=c.scrollLeft,t0=performance.now(),D=reduce?1:520;const st=n=>{const k=Math.min(1,(n-t0)/D);c.scrollLeft=from+(to-from)*(1-Math.pow(1-k,4));if(k<1)raf=requestAnimationFrame(st);else c.classList.remove('dg')};raf=requestAnimationFrame(st)};
 c.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});
 c.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.target.closest('.qa'))return;dn=true;mv=0;lx=e.clientX;v=0;cancelAnimationFrame(raf);c.classList.add('dg')});
 addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-lx;lx=e.clientX;mv+=Math.abs(dx);c.scrollLeft-=dx;v=dx});
 addEventListener('pointerup',()=>{if(!dn)return;dn=false;const m=()=>{if(Math.abs(v)>.6&&!reduce){c.scrollLeft-=v;v*=.94;raf=requestAnimationFrame(m)}else snap()};m()});
 c.addEventListener('click',e=>{if(mv>6){e.stopPropagation();e.preventDefault()}mv=0},true);
 c.addEventListener('keydown',e=>{if(e.target===c&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))c.scrollBy({left:(e.key==='ArrowRight'?1:-1)*250,behavior:reduce?'auto':'smooth'})})})();

const h0=location.hash.slice(1);ci=IDS.includes(h0)?h0:(h0?'lost':'home');navTo(ci);
const first=enter($('#'+ci),150);first.finished.then(()=>first.cancel());
