help:{lab:'Help',t:'How can we <em>help?</em>',lead:'Answers on ordering, delivery and more.',kids:['delivery','payment','returns','faq','gifts','wholesale']},
delivery:{p:'help',lab:'Delivery',d:'Dhaka and nationwide',t:'Delivery.',lead:'We deliver across Bangladesh.',b:[{k:'kv',i:[['Dhaka','1–2 days · ৳60'],['Other districts','3–5 days · ৳120'],['Free delivery','Orders over ৳2,000']]}]},
payment:{p:'help',lab:'Payment',d:'bKash, Nagad, cash',t:'Payment.',lead:'Pay the way that suits you.',b:[{k:'kv',i:[['bKash','Send money'],['Nagad','Send money'],['Cash on delivery','Dhaka only']]}]},
returns:{p:'help',lab:'Returns',d:'Replace or refund',t:'Returns.',lead:'Simple, with no arguments.',b:[{k:'steps',i:[['Tell us','Message us within 7 days with a photo.'],['We check','We confirm the issue the same day.'],['Made right','Replacement or refund, your choice.']]}]},
faq:{p:'help',lab:'FAQ',d:'Common questions',t:'Questions.',b:[{k:'faq',i:[['Is the honey raw?','Yes. It is strained only, never heated or blended.'],['How do I order?','Add items to your bag and send the order on WhatsApp.'],['How should I store ghee?','In a cool, dry place with the lid closed. No fridge needed.'],['Do you deliver outside Dhaka?','Yes, to all districts. See Delivery for timing and cost.']]}]},
gifts:{p:'help',lab:'Gifts',d:'Boxes for Eid and weddings',t:'Gift <em>boxes.</em>',lead:'Honey, ghee and tea, packed to give.',b:[{k:'cards',i:[['Small box','One honey and one tea.'],['Large box','Honey, ghee, oil and tea.']]},{k:'btn'}]},
wholesale:{p:'help',lab:'Wholesale',d:'For shops and cafés',t:'Wholesale.',lead:'Stock Sholo Ana in your shop, café or restaurant.',b:[{k:'cards',i:[['Bulk pricing','Better rates from 20 packs.'],['Your branding','Custom labels on request.']]},{k:'btn'}]},
contact:{lab:'Contact',t:'Say <em>salaam.</em>',lead:'Ask a question or place an order. We reply the same day.',form:1}};
P.forEach((p,i)=>{p.id=slug(p[1]);INFO[p.id]={p:p[0],lab:p[1],bn:p[2],d:'৳'+p[8],t:p[1],prod:i}});
Object.values(INFO).forEach(I=>{if(I.cat)I.d=P.filter(p=>p[0]===I.cat).length+' items'});
const IDS=['home',...Object.keys(INFO)];

/* ================= PAGE TEMPLATES ================= */
const row=(id,meta)=>`<a class="row rv" href="#${id}" data-go="${id}"><span class="rt"><b>${INFO[id].lab}</b><small>${INFO[id].bn||''}</small></span><span class="rm">${meta}<i class="ar"></i></span></a>`;
const blk=b=>({
 cards:()=>`<div class="cards">${b.i.map(c=>`<div class="card glass rv">${c[2]?`<span class="bn">${c[2]}</span>`:''}<h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`,
 steps:()=>`<ol>${b.i.map(c=>`<li class="glass rv"><div><h3>${c[0]}</h3><p>${c[1]}</p></div></li>`).join('')}</ol>`,
 kv:()=>`<div class="kv glass rv">${b.i.map(c=>`<div class="kr"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>`,
 faq:()=>`<div class="faq glass rv">${b.i.map(c=>`<div class="prow"><button class="ph" aria-expanded="false">${c[0]}<i class="pl"></i></button><div class="pd"><div><p>${c[1]}</p></div></div></div>`).join('')}</div>`,
 btn:()=>`<div class="acts rv"><a class="btn solid mag" href="#contact" data-go="contact">Message us</a></div>`}[b.k]());
function pageHTML(id){
  const I=INFO[id];let ch=[],x=id;while(x){ch.unshift(x);x=INFO[x].p}
  const crumb=`<nav class="crumb rv" aria-label="Breadcrumb"><a href="#home" data-go="home">Home</a>${ch.map((c,k)=>`<i>/</i>${k<ch.length-1?`<a href="#${c}" data-go="${c}">${INFO[c].lab}</a>`:`<span>${INFO[c].lab}</span>`}`).join('')}</nav>`;
  const left=`${crumb}<h2 class="sp">${I.t}</h2>${I.bn&&I.prod!==undefined?`<p class="bnl rv">${I.bn}</p>`:''}${I.lead?`<p class="lead rv">${I.lead}</p>`:''}`;
  let r='';
  if(I.kids)r=`<div class="rl glass rv">${I.kids.map(k=>row(k,INFO[k].d||'')).join('')}</div>`;
  else if(I.cat)r=`<div class="rl glass rv">${P.filter(p=>p[0]===I.cat).map(p=>row(p.id,'৳'+p[8])).join('')}</div>`;
  else if(I.prod!==undefined){const p=P[I.prod];r=`<div class="pp glass rv"><p class="lab">Ingredients</p><p class="d">${p[3]}</p><div class="st"><div><b>${p[4]}</b><small>Net</small></div><div><b>${p[5]}</b><small>${p[6]}</small></div><div><b>${p[7]}</b><small>Shelf life</small></div></div><div class="bu"><span>৳${p[8]}<small>${p[9]}</small></span><button class="btn solid add mag" data-i="${I.prod}">Add to bag</button></div></div>`}
  else if(I.form)r=`<form class="glass rv" id="form"><input name="n" placeholder="Your name" required><input name="p" placeholder="Phone number" inputmode="tel" required><textarea name="m" rows="4" placeholder="How can we help?" required></textarea><button class="btn solid mag" type="submit">Send on WhatsApp</button></form>`;
  else r=(I.b||[]).map(blk).join('');
  if(I.p){const sib=IDS.filter(k=>k!=='home'&&INFO[k].p===I.p);if(sib.length>1){const n=sib[(sib.indexOf(id)+1)%sib.length];r+=`<a class="next glass rv" href="#${n}" data-go="${n}"><span><small>Next</small><b>${INFO[n].lab}</b></span><i class="ar"></i></a>`}}
  return `<div class="wrap"><div class="two"><div class="l">${left}</div><div class="r">${r}</div></div></div>`;
}
const app=$('#app');
Object.keys(INFO).forEach(id=>{const s=document.createElement('section');s.className='page';s.id=id;s.innerHTML=pageHTML(id);app.appendChild(s)});
$('#mq').innerHTML=[...P,...P].map(p=>`<span>${p[2]}</span>`).join('');
/* word-masked text reveal */
$$('.sp').forEach(el=>{let c=0;(function w(n){[...n.childNodes].forEach(k=>{if(k.nodeType===3){const f=document.createDocumentFragment();k.textContent.split(/(\s+)/).forEach(s=>{if(!s.trim())f.append(s);else{const e=document.createElement('span');e.className='w';e.innerHTML=`<i style="--c:${c++}">${s}</i>`;f.append(e)}});k.replaceWith(f)}else w(k)})})(el)});

/* ================= ROUTING: smooth camera push ================= */
let ci=null,busy=false;const bgw=$('#bgw'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const topOf=id=>{while(INFO[id]&&INFO[id].p)id=INFO[id].p;return id};
function navTo(id){const t=topOf(id);let on=null;$$('.nav a').forEach(a=>{const m=a.dataset.go===t;a.classList.toggle('act',m);if(m)on=a});const i=$('#ind');i.style.opacity=on?1:0;if(on){i.style.left=on.offsetLeft+'px';i.style.width=on.offsetWidth+'px'}}
function enter(page,delay){
  page.classList.add('on');page.scrollTop=0;$$('.rv',page).forEach((e,j)=>e.style.setProperty('--i',j));
  requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.add('in')));
  return page.animate([{transform:'translateZ(-720px) scale(.97)',opacity:0},{transform:'translateZ(0) scale(1)',opacity:1}],{duration:reduce?1:1500,delay,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
}
function go(id){
  if(busy||!IDS.includes(id)||id===ci)return;busy=true;
  const out=$('#'+ci),inn=$('#'+id);ci=id;navTo(id);closeBag();
  if(location.hash.slice(1)!==id)location.hash=id;
  const a=out.animate([{transform:'translateZ(0) scale(1)',opacity:1},{transform:'translateZ(560px) scale(1.04)',opacity:0}],{duration:reduce?1:950,easing:'cubic-bezier(.6,0,.3,1)',fill:'forwards'});
  bgw.animate([{transform:'scale(1)'},{transform:'scale(1.14)',offset:.45},{transform:'scale(1)'}],{duration:reduce?1:2200,easing:'cubic-bezier(.45,0,.2,1)'});
  const b=enter(inn,reduce?0:420);
  a.finished.then(()=>{out.classList.remove('on','in');a.cancel()});
  b.finished.then(()=>{b.cancel();busy=false});
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go);return}
  const h=e.target.closest('.faq .ph');if(h){const r=h.parentNode,o=r.classList.contains('open');$$('.faq .open').forEach(x=>{x.classList.remove('open');$('.ph',x).setAttribute('aria-expanded','false')});if(!o){r.classList.add('open');h.setAttribute('aria-expanded','true')}return}
  const ad=e.target.closest('.add');if(ad){add(+ad.dataset.i,ad);return}
  if(e.target.closest('#bag'))openBag();
  if(e.target.closest('#dc,#scrim'))closeBag();
  const q=e.target.closest('.q button');if(q)add(+q.dataset.i,null,+q.dataset.d);
});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==ci)go(id)});
addEventListener('keydown',e=>{if(e.key==='Escape')closeBag()});
addEventListener('resize',()=>navTo(ci));

/* ================= BAG ================= */
const cart={};const cnt=()=>Object.values(cart).reduce((s,q)=>s+q,0),tot=()=>Object.entries(cart).reduce((s,[i,q])=>s+P[i][8]*q,0);
function add(i,btn,d=1){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];draw();
  if(btn){btn.textContent='Added';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Add to bag';btn.classList.remove('ok')},1400);const b=$('#bag');b.classList.remove('bump');b.offsetWidth;b.classList.add('bump')}}
function draw(){$('#cn').textContent=`(${cnt()})`;$('#dt').textContent='৳'+tot();
  const k=Object.keys(cart);$('#dl').innerHTML=k.length?k.map(i=>`<div class="li"><div><b>${P[i][1]}</b><small>৳${P[i][8]} · ${P[i][4]}</small></div><div class="q"><button data-i="${i}" data-d="-1" aria-label="Remove one">−</button><span>${cart[i]}</span><button data-i="${i}" data-d="1" aria-label="Add one">+</button></div></div>`).join(''):'<p class="emp">Your bag is empty. Pick something from the shop.</p>'}
const openBag=()=>document.body.classList.add('bo'),closeBag=()=>document.body.classList.remove('bo');draw();
$('#dw').onclick=()=>{if(!cnt()){closeBag();go('shop');return}open(`https://wa.me/${WA}?text=${encodeURIComponent('Order:\n'+Object.entries(cart).map(([i,q])=>`- ${P[i][1]} (${P[i][4]}) x${q}`).join('\n')+'\nTotal: ৳'+tot())}`,'_blank')};
$('#form').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);open(`https://wa.me/${WA}?text=${encodeURIComponent(`Name: ${d.get('n')}\nPhone: ${d.get('p')}\n${d.get('m')}`)}`,'_blank')});

/* ================= POINTER ================= */
const ring=$('#ring');let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,px=0,py=0;
addEventListener('pointermove',e=>{
  mx=e.clientX;my=e.clientY;ring.classList.toggle('h',!!e.target.closest('a,button,.glass'));
  const g=e.target.closest('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}
  const c=e.target.closest('.card');$$('.on .card').forEach(k=>{if(k===c){const r=k.getBoundingClientRect();k.style.setProperty('--rx',((e.clientY-r.top)/r.height-.5)*-8+'deg');k.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*8+'deg')}else{k.style.setProperty('--rx','0deg');k.style.setProperty('--ry','0deg')}});
  $$('.on .mag').forEach(m=>{const r=m.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);m.style.transform=Math.hypot(dx,dy)<80?`translate(${dx*.25}px,${dy*.35}px)`:''});
});
(function loop(){requestAnimationFrame(loop);
  rx=lerp(rx,mx,.22);ry=lerp(ry,my,.22);ring.style.transform=`translate3d(${rx}px,${ry}px,0)`;
  px=lerp(px,mx/innerWidth-.5,.05);py=lerp(py,my/innerHeight-.5,.05);
  const w=$('.page.on .wrap');if(w&&!busy)w.style.transform=`translate3d(${px*-10}px,${py*-8}px,0)`;
})();

/* start */
const h0=location.hash.slice(1);ci=IDS.includes(h0)?h0:'home';navTo(ci);
const first=enter($('#'+ci),150);first.finished.then(()=>first.cancel());
</script>
</body>
</html>
